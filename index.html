
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meine IP-Info</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 50px 20px;
    }
    main {
      max-width: 420px;
      margin: auto;
      padding: 28px;
      background: #1e293b;
      border-radius: 18px;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px;
    }
    #ip { font-size: 20px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Meine IP-Info</h1>
    <p>Diese Seite zeigt deine öffentliche IP-Adresse.</p>
    <p id="ip">Noch nicht geladen</p>
    <button onclick="showIP()">IP anzeigen</button>
    <button onclick="sendIP()">IP freiwillig teilen</button>
    <p id="status"></p>
    <small>Deine IP wird nur nach deiner Entscheidung
      in eine Nachricht übernommen.</small>
  </main>

  <script>
    let currentIP = "";

    async function showIP() {
      const status = document.getElementById("status");
      try {
        const response = await fetch(
          "https://api.ipify.org?format=json"
        );
        const data = await response.json();
        currentIP = data.ip;
        document.getElementById("ip").textContent = currentIP;
        status.textContent = "IP geladen.";
      } catch {
        status.textContent = "IP konnte nicht geladen werden.";
      }
    }

    function sendIP() {
      if (!currentIP) {
        document.getElementById("status").textContent =
          "Bitte zuerst auf IP anzeigen klicken.";
        return;
      }

      const message = "Meine öffentliche IP ist: " + currentIP;
      const confirmed = confirm(
        "Möchtest du diese IP in eine Nachricht übernehmen?\n\n"
        + currentIP
      );

      if (confirmed) {
        const url = "https://wa.me/?text=" +
          encodeURIComponent(message);
        window.open(url, "_blank", "noopener");
      }
    }
  </script>
</body>
</html>
